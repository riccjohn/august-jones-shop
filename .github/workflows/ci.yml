name: CI

on:
  pull_request:
  push:
    branches: [main, content-updates]

jobs:
  # Gitleaks is an independent check, so it runs alongside the other jobs
  # rather than gating them. Making `checks` and `e2e` wait on it bought
  # nothing but a second runner acquisition on the critical path.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify images are optimized
        run: |
          echo "Checking for unoptimized images in public/images..."
          if find public/images -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) | grep -v ".gitkeep" | grep -q .; then
            echo "❌ Error: Found unoptimized JPG/PNG images in public/images"
            echo "Please run 'pnpm optimize:images' to convert them to WebP"
            echo ""
            echo "Found files:"
            find public/images -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \)
            exit 1
          fi
          echo "✅ All images are optimized (WebP only)"

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck relay
        run: pnpm exec tsc -p relay --noEmit

      - name: Typecheck functions
        run: pnpm exec tsc -p functions --noEmit

      # Builds against the real events data. The e2e job builds separately with
      # E2E_TEST=true, which swaps in fixture events, so this step is the only
      # place the production data path is exercised.
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser binaries are keyed on the Playwright version rather than the
      # lockfile hash: they only change when Playwright itself does, so an
      # unrelated dependency bump shouldn't cost a 40-60s re-download.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      # The cache restores the browser binaries but not the apt packages they
      # link against, and those live outside the runner image for webkit in
      # particular. install-deps is the cheap half of --with-deps.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
