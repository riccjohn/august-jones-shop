app = "august-jones-relay"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on, per ADR-0003. Scale-to-zero is deliberately disabled: a cold
  # start risks emitting from an unstable source IP, which is the exact failure
  # this relay exists to fix. The $2.02/mo always-on cost is budgeted in the ADR.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
